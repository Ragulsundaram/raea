[package]
name = "raea-page"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "HTML, CSS and React pages in Bevy (docs/blitz-bevy.feature): Blitz works out what a page looks like, Vello paints it on Bevy's own GPU device into a Bevy Image"

[dependencies]
# the layers under it
raea-sys-page = { path = "../../systems/page" }
raea-sys-fonts = { path = "../../systems/fonts" }
# the layer pass's page half (docs/review.feature R2b)
raea-sys-layers = { path = "../../systems/layers", features = ["page"] }
raea-runtime-twins = { path = "../../runtime/twins" }
raea-runtime-dom = { path = "../../runtime/dom" }
raea-runtime-edit = { path = "../../runtime/edit" }
raea-runtime-input = { path = "../../runtime/input" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "bevy_render", "bevy_asset", "bevy_image", "bevy_log", "bevy_window", "ui_bevy_render", "bevy_picking", "ui_picking", "bevy_input_focus"] }
# the document: stylo's styles, Taffy's and Blitz's layout (floats on, as Chrome lays them out)
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["svg", "woff", "system-fonts", "floats", "text-transform-icu", "complex-scripts"] }
# the laid-out lines' glyph runs, where a render manifest's text has its ink (motion/manifest.rs)
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
vello = { version = "=0.11.0", default-features = false, features = ["wgpu"] }
wgpu = "=30.0.1"
# a page's script host: JS engines, native calls, media, canvas, accessibility records
raea-runtime-js = { path = "../../runtime/js" }
# the registered Bevy plugins' changes to DefaultPlugins (motion.rs: WinitPlugin off in a plugin build)
raea-runtime-plugins = { path = "../../runtime/plugins" }
# the op wire, and the element tree raea's page diffs into ops (motion.rs)
raea-core-wire = { path = "../../core/wire" }
# the GPU canary, bump and memory checks, and refusals
raea-gpu-device = { path = "../../gpu/device" }
serde_json = "1"
# an inline svg's <text>s, as usvg set them (the render manifest's runs, layout-reads LR10)
usvg = { version = "=0.48.1", default-features = false, features = ["text"] }
# HTML files parsed by Blitz (motion.rs open_html: an HTML page, WPT's tests), and their URLs
blitz-html = "=0.3.0-beta.4"
url = "2"
# the formats an <img> may hold here, as bevy_ui's page loads them (Blitz decodes with this crate: a DDS or TGA was 0x0)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tga", "dds", "hdr", "exr"] }
# video elements' frames (motion.rs place_videos): the app's decoders, as raea-runtime-js's page
raea-io-media = { path = "../../io/media", default-features = false }
# an element's damage when its picture changes (blitz-dom's own type)
stylo = "=0.22.0"

[dev-dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "bevy_render", "bevy_core_pipeline", "bevy_log", "png", "bevy_window"] }
